<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>테스트 페이지</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { color: #1f3b63; font-size: 22px; }
    input, button { font-size: 16px; padding: 10px; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; }
    button { width: 100%; background: #1f4e9c; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #out { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>오늘은 무슨 일을 할까요?</h1>
  <p>어떤 일을 하면 좋을지 추천드립니다.</p>
  <input id="name" placeholder="이름을 입력하세요">
  <button id="go">인사하기</button>
  <p id="out"></p>
  <script>
    document.getElementById('go').onclick = function () {
      var n = document.getElementById('name').value.trim();
      document.getElementById('out').textContent = n ? n + '님, 안녕하세요!' : '이름을 입력해 주세요.';
    };
  </script>
</body>
</html>
